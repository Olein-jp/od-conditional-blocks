name: Release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: タグ形式を確認
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer lint
      - name: 配布 ZIP を作成
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/package.sh "$RELEASE_TAG"
      - run: unzip -t dist/od-conditional-blocks.zip
      - name: ZIP を添付して Release を公開
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/od-conditional-blocks.zip --verify-tag --title "$RELEASE_TAG" --generate-notes
